# =============================================================================
#  Battery HD Pro — API 站点配置
#  纯 API 服务：80 提供 /api/v1，8080 作为 Cloudflare 回源端口
# =============================================================================

# Cloudflare 提供国家码；无 CDN 时降级为空
map $http_cf_ipcountry $geo_country {
    default  $http_cf_ipcountry;
    ""       "";
}

upstream batteryhd_php {
    server php:9000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 512k;      # 上报请求体上限（PRD 10.3.5：≤100KB）
    client_body_timeout  10s;
    send_timeout         15s;

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log warn;

    # 健康检查
    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_pass batteryhd_php;
    }

    location / {
        try_files $uri $uri/ @api;
    }

    location @api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param HTTP_CF_IPCOUNTRY $geo_country;
        fastcgi_pass batteryhd_php;
    }

    location ~ \.php$ {
        return 404;
    }
}

# ------------------------------------- 8080：Cloudflare 回源专用（非标准端口）
# 阿里云对未备案域名的 80/443 有拦截，非标准端口不拦。
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 512k;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param HTTP_CF_IPCOUNTRY $geo_country;
        fastcgi_pass batteryhd_php;
    }
}

